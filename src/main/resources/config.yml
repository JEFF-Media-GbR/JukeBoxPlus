# How many ticks to wait between Jukebox check
# Setting this too high will result in pauses between loops, but setting it too low
# can cause lags on very large servers
# Recommended: 20 to 40 (1 to 2 seconds)
tick-delay: 40

# When using the bossbar for messages, you can change the duration for those messages here
# 20 ticks = 1 second
ticks-per-bossbar-message: 50

debug: true